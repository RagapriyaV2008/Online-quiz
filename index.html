<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Quiz Application</title>

    <!-- CSS Styling -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #5b4bdb;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .quiz-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #444;
            font-weight: bold;
        }

        #question {
            font-size: 20px;
            margin-bottom: 20px;
            color: #222;
            line-height: 1.5;
        }

        .option {
            display: block;
            background: #f1f3ff;
            padding: 13px;
            margin-bottom: 12px;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .option:hover {
            background: #e0e5ff;
            border-color: #667eea;
        }

        .option input {
            margin-right: 10px;
            cursor: pointer;
        }

        .option:has(input:checked) {
            border-color: #667eea;
            background: #e0e5ff;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5145cd;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #feedback {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }

        #result {
            display: none;
            text-align: center;
        }

        #result h2 {
            color: #5b4bdb;
            margin-bottom: 15px;
        }

        #score {
            font-size: 22px;
            margin: 20px 0;
            color: #333;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        #progress {
            height: 100%;
            width: 0%;
            background: #667eea;
            transition: width 0.3s;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .quiz-container {
                padding: 20px;
            }

            #question {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="quiz-container">

        <!-- Quiz Heading -->
        <div id="quiz">
            <h1>Online Quiz Application</h1>

            <p class="subtitle">
                Test Your Knowledge!
            </p>

            <div class="quiz-info">
                <span id="question-number">Question 1 / 5</span>
                <span id="current-score">Score: 0</span>
            </div>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

            <h2 id="question"></h2>

            <div id="options"></div>

            <p id="feedback" aria-live="polite"></p>

            <button id="next-btn" onclick="nextQuestion()">
                Next Question
            </button>
        </div>

        <!-- Result Section -->
        <div id="result">
            <h2>Quiz Completed!</h2>

            <p id="score"></p>

            <p id="message"></p>

            <button onclick="restartQuiz()">
                Play Again
            </button>
        </div>

        <div class="footer">
            Online Quiz Application | HTML, CSS & JavaScript
        </div>

    </div>

    <!-- JavaScript -->
    <script>

        // Quiz Questions
        const questions = [
            {
                question: "1. What does HTML stand for?",
                options: [
                    "Hyper Text Markup Language",
                    "High Text Machine Language",
                    "Hyper Tool Multi Language",
                    "Home Text Markup Language"
                ],
                answer: 0
            },

            {
                question: "2. Which language is used to style web pages?",
                options: [
                    "Python",
                    "CSS",
                    "Java",
                    "C++"
                ],
                answer: 1
            },

            {
                question: "3. Which language makes web pages interactive?",
                options: [
                    "HTML",
                    "CSS",
                    "JavaScript",
                    "SQL"
                ],
                answer: 2
            },

            {
                question: "4. Which tag is used to create a hyperlink in HTML?",
                options: [
                    "<link>",
                    "<a>",
                    "<href>",
                    "<url>"
                ],
                answer: 1
            },

            {
                question: "5. Which symbol is used for comments in CSS?",
                options: [
                    "// comment",
                    "<!-- comment -->",
                    "/* comment */",
                    "# comment"
                ],
                answer: 2
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        // Display Question
        function loadQuestion() {

            answered = false;

            const q = questions[currentQuestion];

            document.getElementById("question").textContent =
                q.question;

            document.getElementById("question-number").textContent =
                "Question " + (currentQuestion + 1) +
                " / " + questions.length;

            document.getElementById("current-score").textContent =
                "Score: " + score;

            document.getElementById("progress").style.width =
                (currentQuestion / questions.length * 100) + "%";

            document.getElementById("feedback").textContent = "";

            const optionsDiv = document.getElementById("options");

            optionsDiv.innerHTML = "";

            q.options.forEach(function(option, index) {

                const label = document.createElement("label");

                label.className = "option";

                const radio = document.createElement("input");

                radio.type = "radio";
                radio.name = "answer";
                radio.value = index;

                label.appendChild(radio);
                label.appendChild(document.createTextNode(option));

                optionsDiv.appendChild(label);

            });

            const nextButton = document.getElementById("next-btn");

            nextButton.disabled = true;

            nextButton.textContent =
                currentQuestion === questions.length - 1
                ? "Submit Quiz"
                : "Next Question";

            // Enable Next only after selecting an answer
            document.querySelectorAll('input[name="answer"]')
                .forEach(function(input) {

                    input.addEventListener("change", function() {
                        nextButton.disabled = false;
                    });

                });
        }

        // Check Answer and Move to Next Question
        function nextQuestion() {

            if (answered) {
                return;
            }

            const selected = document.querySelector(
                'input[name="answer"]:checked'
            );

            if (!selected) {
                document.getElementById("feedback").textContent =
                    "Please select an answer!";
                return;
            }

            answered = true;

            const selectedAnswer = Number(selected.value);

            if (selectedAnswer === questions[currentQuestion].answer) {

                score++;

                document.getElementById("feedback").textContent =
                    "Correct Answer!";

                document.getElementById("feedback").style.color =
                    "green";

            } else {

                document.getElementById("feedback").textContent =
                    "Wrong Answer!";

                document.getElementById("feedback").style.color =
                    "red";

            }

            document.getElementById("current-score").textContent =
                "Score: " + score;

            document.querySelectorAll('input[name="answer"]')
                .forEach(function(input) {
                    input.disabled = true;
                });

            const nextButton = document.getElementById("next-btn");

            nextButton.disabled = false;

            nextButton.textContent =
                currentQuestion === questions.length - 1
                ? "View Result"
                : "Continue";

            nextButton.onclick = function() {

                currentQuestion++;

                if (currentQuestion < questions.length) {
                    loadQuestion();
                } else {
                    showResult();
                }

            };
        }

        // Display Final Result
        function showResult() {

            document.getElementById("quiz").style.display = "none";

            document.getElementById("result").style.display = "block";

            document.getElementById("progress").style.width = "100%";

            document.getElementById("score").textContent =
                "Your Score: " + score + " / " + questions.length;

            const percentage = (score / questions.length) * 100;

            let message;

            if (percentage === 100) {
                message = "Excellent! You got all answers correct!";
            } else if (percentage >= 60) {
                message = "Good Job! Keep learning!";
            } else {
                message = "Keep Practicing! You can do better!";
            }

            document.getElementById("message").textContent = message;
        }

        // Restart Quiz
        function restartQuiz() {

            currentQuestion = 0;
            score = 0;
            answered = false;

            document.getElementById("quiz").style.display = "block";

            document.getElementById("result").style.display = "none";

            document.getElementById("next-btn").onclick = nextQuestion;

            loadQuestion();
        }

        // Start Quiz
        loadQuestion();

    </script>

</body>
</html>
